[project]
name = "aeris-server"
version = "0.1.0"
description = "Aeris API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask (>=3.1)",
    "mysql-connector-python (>=9.0)",
    "pyjwt (>=2.9)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.vercel]
entrypoint = "app:app"
